name: NC Decision quality gate

on:
  workflow_dispatch:
  push:
    branches: [main, feature/ai-expert-damu-v1, fix/qa-v2-oked-program-rules, fix/ai-expert-ui-p1-p2-2026-10-08, fix/ui-ux-stage3-eight-improvements]
    paths:
      - 'src/**'
      - 'scripts/random_funding_smoke.ts'
      - 'scripts/ai_expert_contract_smoke.ts'
      - 'scripts/qa_v2_program_rules.ts'
      - 'package.json'
      - '.github/workflows/quality-gate.yml'

permissions:
  contents: read

jobs:
  typecheck-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps
      - name: TypeScript check
        run: npm run lint
      - name: Randomized funding routing smoke tests
        run: npm run test:smoke
      - name: AI Expert contract smoke tests
        run: npm run test:ai-expert
      - name: QA v2 program-rules matrix
        run: npm run test:qa-v2
